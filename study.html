<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>통합사회2 윤리 암기 학습</title><style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;--line:#e5e7eb;--accent:#315efb;--soft:#eef2ff;--ok:#15803d;--bad:#b42318}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:var(--bg);color:var(--text)}header{position:sticky;top:0;z-index:5;background:rgba(245,247,251,.94);backdrop-filter:blur(10px);padding:14px 16px;border-bottom:1px solid var(--line)}h1{font-size:20px;margin:0 0 10px}.tabs,.levels{display:flex;gap:8px;overflow:auto;padding-bottom:2px}button,select{font:inherit}button{min-height:44px;border:1px solid var(--line);border-radius:12px;background:white;padding:8px 13px;cursor:pointer}button.active{background:var(--accent);color:white;border-color:var(--accent)}main{max-width:900px;margin:auto;padding:16px 16px 80px}.nav{display:flex;gap:8px;overflow:auto;margin-bottom:14px}.nav button{white-space:nowrap}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 1px 2px rgba(0,0,0,.03)}.label{font-size:13px;color:var(--muted);font-weight:700;margin-bottom:8px}.text{font-size:16px;line-height:1.9;word-break:keep-all}.mask{display:inline-block;min-height:40px;background:#172033;color:#172033;border-radius:8px;padding:4px 8px;margin:1px 2px;vertical-align:middle;cursor:pointer;user-select:none}.mask.reveal{background:var(--soft);color:var(--text);outline:1px solid #c7d2fe}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.pill{font-size:12px;background:var(--soft);padding:5px 8px;border-radius:999px}.oxrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.ans{font-weight:900;font-size:22px;min-width:48px;text-align:center}.ans.O{color:var(--ok)}.ans.X{color:var(--bad)}table{width:100%;border-collapse:collapse;font-size:14px}th,td{border:1px solid var(--line);padding:10px;text-align:center}td:first-child{text-align:left}.hidden{display:none}.progress{font-size:13px;color:var(--muted);margin-top:8px}@media(max-width:600px){main{padding:12px 12px 72px}.text{font-size:15px;line-height:1.85}.card{padding:14px}}
</style></head><body><header><h1>📚 통합사회2 윤리 암기 학습</h1><div class="tabs"><button class="group active" data-g="교정적 정의">교정적 정의</button><button class="group" data-g="공동체주의적 정의관">공동체주의적 정의관</button><button class="group" data-g="OX 문제">OX 문제</button><button class="group" data-g="사상가 비교">사상가 비교</button></div></header><main><div id="subnav" class="nav"></div><div id="levels" class="levels"></div><div id="content"></div></main><script>const DATA={"sections": [{"title": "정의의 의미", "group": "교정적 정의", "items": [{"label": "정의의 의미", "text": "인간이 지켜야 할 올바른 도리 또는 사회를 구성하고 유지하는 공정한 도리로, 개인이나 사회가 추구해야 할 기본적인 덕목", "masks": ["올바른 도리", "공정한 도리", "기본적인 덕목"]}, {"label": "정의의 의미", "text": "재화, 보상, 처벌, 사회적 대우 등에서 모든 사람에게 각자의 정당한 몫이 공정하게 분배되는 것", "masks": ["정당한 몫", "공정하게 분배"]}, {"label": "분배적 정의", "text": "각자가 자신이 받아야 할 몫을 공정하게 받도록 하는 것", "masks": ["몫", "공정하게"]}, {"label": "분배적 정의", "text": "사회적 자원을 공정하게 분배하는 원칙과 관련", "masks": ["공정하게 분배"]}, {"label": "교정적 정의", "text": "불공정한 행위나 잘못된 행동을 바로잡는 것, 잘못에 대한 대응이 공정한지와 관련", "masks": ["불공정한 행위", "잘못된 행동", "공정한지"]}]}, {"title": "처벌에 대한 관점", "group": "교정적 정의", "items": [{"label": "응보주의 관점", "text": "처벌의 본질은 범죄 행위에 대한 응당한 보복을 가하는 것", "masks": ["응당한 보복"]}, {"label": "응보주의 관점", "text": "범죄 행위에 상응하는 동등한 형벌 부과", "masks": ["동등한 형벌"]}, {"label": "응보주의 관점", "text": "범죄 행위에 대한 개인의 책임 강조", "masks": ["개인의 책임"]}, {"label": "응보주의 문제점", "text": "범죄 예방에 도움을 주지 못할 수 있음", "masks": ["범죄 예방"]}, {"label": "응보주의 문제점", "text": "범죄자의 교화에 상대적으로 무관심할 수 있음", "masks": ["범죄자의 교화"]}, {"label": "공리주의 관점", "text": "처벌은 사회적 이익을 증진하기 위한 수단", "masks": ["사회적 이익"]}, {"label": "공리주의 관점", "text": "위법의 이익보다 처벌로 인한 손실이 더 크도록 형벌 부과", "masks": ["처벌로 인한 손실"]}, {"label": "공리주의 관점", "text": "처벌의 사회적 효과 강조", "masks": ["사회적 효과"]}, {"label": "공리주의 문제점", "text": "처벌의 예방 효과를 증명하기 어려움", "masks": ["예방 효과"]}, {"label": "공리주의 문제점", "text": "범죄자 처벌을 사회 안정을 위한 수단으로 여겨 인간 존엄성과 가치를 훼손할 수 있음", "masks": ["사회 안정을 위한 수단", "인간 존엄성과 가치"]}]}, {"title": "사형 제도에 대한 관점", "group": "교정적 정의", "items": [{"label": "칸트", "text": "응보주의 관점에서 살인자에 대한 사형은 정당하며 사형 이외의 형벌은 동등성(평등성)의 원리에 부합하지 않음", "masks": ["응보주의", "동등성(평등성)의 원리"]}, {"label": "칸트", "text": "사형은 살인자의 고통받는 인격을 해방하여 인간의 존엄성을 실현하는 것임", "masks": ["인간의 존엄성"]}, {"label": "칸트", "text": "→ 사형은 인간의 존엄성과 가치를 인정하는 형벌", "masks": ["인간의 존엄성과 가치"]}, {"label": "칸트", "text": ": 자신의 자율적 행위, 즉 스스로 저지른 살인에 대해 응분의 책임을 지우는 것", "masks": ["자율적 행위", "응분의 책임"]}, {"label": "칸트 · 참고", "text": "정언명령의 예시 中 인격주의 “너 자신과 다른 모든 사람의 인격을 결코 수단으로만 취급하지 말고, 언제나 동시에 목적으로 대우하도록 행위하라.”", "masks": ["수단으로만 취급하지 말고", "동시에 목적으로"]}, {"label": "베카리아", "text": "공리주의 관점에서 종신 노역형이 범죄 예방과 사회 전체의 이익 증진에 부합함", "masks": ["종신 노역형", "범죄 예방", "사회 전체의 이익 증진"]}, {"label": "베카리아", "text": "생명은 양도할 수 없는 것이기 때문에 사형은 부당함", "masks": ["양도할 수 없는 것", "사형은 부당함"]}, {"label": "베카리아", "text": "→ 사형이 종신 노역형보다 범죄 억제 효과가 떨어지므로 사형 반대 (공리주의적 관점)", "masks": ["범죄 억제 효과", "사형 반대"]}, {"label": "베카리아", "text": "어떤 사람도 생명을 빼앗을 권리를 양도하지 않으므로 사형 반대 (사회 계약론적 관점)", "masks": ["생명을 빼앗을 권리를 양도하지 않으므로", "사형 반대"]}, {"label": "베카리아", "text": "살인 금지를 규정한 법에 근거하여 살인(사형)하는 것은 부당함", "masks": ["살인(사형)하는 것은 부당함"]}]}, {"title": "칸트 제시문", "group": "교정적 정의", "items": [{"label": "제시문 1", "text": "사법적 형벌은 범죄자 자신이나 시민 사회와 관련된 다른 선을 증진하는 수단으로 행해져서는 절대 안 되고, 어떠한 경우든 처벌을 받은 개인이 범죄를 저질렀다는 이유만으로 부과되어야 한다.", "masks": ["범죄를 저질렀다는 이유만으로", "의욕했기 때문에", "응당한 보복", "동등성의 원리", "사형"]}, {"label": "제시문 2", "text": "형벌은 범죄자가 처벌받아야 할 행위를 의욕했기 때문에 가해져야 한다. 사형은 살인에 상응하는 보복으로, 사형수의 인간성을 존중하는 길이다.", "masks": ["범죄를 저질렀다는 이유만으로", "의욕했기 때문에", "응당한 보복", "동등성의 원리", "사형"]}, {"label": "제시문 3", "text": "형벌은 범죄자 자신이나 사회의 다른 선을 촉진하기 위해 가해지는 것이 아니라 오직 범죄를 저질렀기 때문에 가해지는 것이다. 또한 동등성의 원리에 따라 범죄자에게는 범죄와 동등한 형벌이 가해져야 한다. 그러므로 살인을 한 사람은 사형에 처해져야만 한다.", "masks": ["범죄를 저질렀다는 이유만으로", "의욕했기 때문에", "응당한 보복", "동등성의 원리", "사형"]}, {"label": "제시문 4", "text": "형벌은 결코 범죄자가 자신의 선(善)을 비롯한 어떤 다른 선을 증진하기 위해 가해질 수는 없고, 오직 범죄자가 범죄를 저질렀기 때문에 가해져야 한다. 인간은 물건처럼 타인의 의도를 위한 수단으로 취급될 수 없을 뿐만 아니라 자신이 의욕한 행위에 대해 책임지는 존엄한 존재이기 때문이다. 또한 형벌의 본질은 범죄 행위에 대한 응당한 보복을 가하는 것에 있으며, 공적 정의가 원리와 표준으로 삼아야 하는 것은 동등성의 원리이다. 만약 어떤 사람이 살인을 했다면 그는 죽어야만 합니다. 제아무리 고통 가득한 생이라 해도 생과 사 사이에 동종성은 없기 때문이다.", "masks": ["범죄를 저질렀다는 이유만으로", "의욕했기 때문에", "응당한 보복", "동등성의 원리", "사형"]}, {"label": "정리", "text": "칸트는 처벌의 본질이 응보에 있으며, 응보주의에 바탕을 둔 형벌은 인간을 단지 다른 목적을 위한 수단으로 취급하는 것이 아니라고 보았다. 그러한 형벌은 범죄자에게 자신의 자율적 행위, 즉 스스로 선택한 행위에 대해 책임을 지게 하는 것이기 때문이다.", "masks": ["응보", "수단", "자율적 행위", "책임"]}]}, {"title": "벤담 제시문", "group": "교정적 정의", "items": [{"label": "제시문 1", "text": "모든 처벌은 그 자체로서 악이다. 공리성의 원리에 의할 때 만일 처벌이 인정될 수 있다면, 그것은 더욱 큰 어떤 악을 없애는 것을 보장하는 한에 있어서만 인정되어야 한다. …(중략)… 처벌의 가치는 어떤 경우에도 위법 행위에서 얻는 이득의 가치를 능가하기에 충분한 수준보다 더 작아서는 안 된다. …(중략)… 막아야 할 폐해가 어떤 것이든 간에 될 수 있는 한 적은 비용으로 막아 내야 한다.", "masks": ["그 자체로서 악", "공리성의 원리", "더 큰 해악", "사회의 행복", "확실성, 근접성", "행위를 통제", "필요한 정도 이상"]}, {"label": "제시문 2", "text": "모든 형벌 자체는 해악이지만 공리의 원칙에 따르면 형벌이 주는 해악보다 더 큰 해악을 제거하여 사회의 행복을 증진할 수 있는 경우에는 형벌이 허용될 수 있다.", "masks": ["그 자체로서 악", "공리성의 원리", "더 큰 해악", "사회의 행복", "확실성, 근접성", "행위를 통제", "필요한 정도 이상"]}, {"label": "제시문 3", "text": "형벌은 그 자체로는 악이다. 그러나 형벌은 공리의 원리에 의해 정당화될 수 있으며, 형벌의 가치를 평가할 때는 확실성, 근접성 등의 측면을 고려해야 한다.", "masks": ["그 자체로서 악", "공리성의 원리", "더 큰 해악", "사회의 행복", "확실성, 근접성", "행위를 통제", "필요한 정도 이상"]}, {"label": "제시문 4", "text": "형벌의 주목적은 범죄자와 그 밖의 사람들의 행위를 통제하는 것이다. 공리의 원리에 따라 범죄자에 대한 형벌은 목적 달성에 필요한 정도 이상으로 가해져서는 안 된다.", "masks": ["그 자체로서 악", "공리성의 원리", "더 큰 해악", "사회의 행복", "확실성, 근접성", "행위를 통제", "필요한 정도 이상"]}, {"label": "정리", "text": "벤담은 사회적 효용의 극대화를 추구하는 공리주의 관점에서 처벌을 정당화하였다. 그에 따르면 처벌의 목적은 일반인에 대한 범죄 예방과 범죄자에 대한 교화이다. 또한 고통을 야기하는 처벌은 그 자체로 악이라고 보았기 때문에 처벌로 초래되는 해악이 처벌을 통해 예방될 해악보다 커서는 안 된다고 주장하였다.", "masks": ["사회적 효용의 극대화", "범죄 예방", "교화", "그 자체로 악", "커서는 안 된다"]}]}, {"title": "베카리아 제시문", "group": "교정적 정의", "items": [{"label": "제시문 1", "text": "범죄의 유일 타당한 척도는 사회에 끼친 해악이다. 범죄의 진정한 척도가 범죄자의 의사에 있다고 믿는 것은 잘못이다. 공통적 효용, 즉 공리가 인간적 정의의 기초이다. …(중략)… 법은 개개인의 특수 의사의 총체인 일반 의사를 대표한다. 그런데 자신의 생명을 빼앗을 권능을 타인에게 기꺼이 양도할 자기 세상에 있겠는가? …(중략)… 사형은 어떠한 의미에서도 권리의 문제가 아니다. 사형은 한 사람의 시민에 대한 국가의 전쟁이다. 그 국가가 한 시민의 존재의 파괴를 유용하거나 필요하다고 판단한 경우에 벌이는 전쟁인 것이다.", "masks": ["사회에 끼친 해악", "공리", "시민의 이익", "종신 노역형", "범죄 억제", "지속적인 인상", "불필요한 고통"]}, {"label": "제시문 2", "text": "형벌은 범죄자가 아닌 시민의 이익을 위해 집행되어야 한다. 범죄자가 노역으로 사회에 끼친 손해를 속죄하는 모습을 오래 보여 주는 것이 사형보다 범죄 억제에 더 효과적이다.", "masks": ["사회에 끼친 해악", "공리", "시민의 이익", "종신 노역형", "범죄 억제", "지속적인 인상", "불필요한 고통"]}, {"label": "제시문 3", "text": "범죄에 대한 가장 강력한 억제력은 범죄자가 사형 당하는 장면을 목격하는 데에서 생겨나지 않는다. 오히려 자유를 박탈당한 채 그가 사회에 끼친 손해를 노동으로 속죄하는 모습을 오래 보게 하는 것이 더 효과적이다.", "masks": ["사회에 끼친 해악", "공리", "시민의 이익", "종신 노역형", "범죄 억제", "지속적인 인상", "불필요한 고통"]}, {"label": "제시문 4", "text": "사형은 한순간에 강렬한 인상만을 줄 뿐이다. 반면 종신 노역형은 더 큰 공포를 안겨 주므로 인간 정신에 미치는 효과가 사형에 비해 크다.", "masks": ["사회에 끼친 해악", "공리", "시민의 이익", "종신 노역형", "범죄 억제", "지속적인 인상", "불필요한 고통"]}, {"label": "제시문 5", "text": "형벌의 목적은 범죄자가 시민들에게 해악을 입힐 가능성을 방지하고 일반 시민들이 유사한 행위를 할 가능성을 억제하는 것이다. 그런데 사형을 통해 범죄 예방 효과를 기대하기는 어렵다. 사형을 대체한 종신 노역형이 범죄 예방에 더 효과적이다. 사형은 유용하지도 않고 필요하지도 않은 형벌이다.", "masks": ["사회에 끼친 해악", "공리", "시민의 이익", "종신 노역형", "범죄 억제", "지속적인 인상", "불필요한 고통"]}, {"label": "제시문 6", "text": "형벌의 목적은 범죄자가 다시 시민들에게 해를 끼치는 것을 막고, 다른 사람들이 비슷한 범죄를 저지르지 않도록 억제하는 데 있다. 따라서 형벌은 범죄의 정도에 비례하면서도, 시민들에게는 지속적인 인상을 남기고, 수형자에게는 불필요한 고통을 주지 않는 방식이어야 한다. 이런 기준에서 보면, 순간적인 공포만을 주는 사형보다 자유를 빼앗아 노역에 종사시키는 형벌이 더 지속적인 본보기 효과를 준다. 반복적이고 눈에 보이는 고통의 과정은 단번에 끝나는 폭력보다 오래 기억되기 때문이다. 또한 사형이 본보기로 기능하려면 매번 새로운 집행이 필요하지만 종신 노역형은 범죄자가 단 한 명만 있어도 계속 본보기 효과를 유지할 수 있다. (26년 고2 6월 통사#4)", "masks": ["사회에 끼친 해악", "공리", "시민의 이익", "종신 노역형", "범죄 억제", "지속적인 인상", "불필요한 고통"]}, {"label": "정리", "text": "베카리아는 공리주의 관점에서 처벌의 목적은 범죄자가 새로운 해악을 입힐 가능성을 방지하고, 일반인들이 유사한 범죄 행위를 할 가능성을 억제시키는 것이라고 보았다. 따라서 지속적으로 고통의 본보기가 되는 종신 노역형이 바람직하다고 주장하였다.", "masks": ["공리주의", "방지", "억제", "종신 노역형"]}]}, {"title": "공동체주의적 정의관", "group": "공동체주의적 정의관", "items": [{"label": "의미", "text": "공동체의 문화와 역사, 전통을 중시하는 관점 → 개인선보다 공동선을 중시함", "masks": ["문화와 역사, 전통", "개인선보다 공동선"]}, {"label": "특징 1", "text": "공동체와 분리되어 독립적으로 존재하는 개인은 있을 수 없다고 봄", "masks": ["독립적으로 존재하는 개인은 있을 수 없음"]}, {"label": "특징 1", "text": "→ 개인의 좋은 삶이 공동체와 분리될 수 없으며, 개인은 공동체에 소속될 때 의미 있는 삶을 살 수 있음", "masks": ["공동체에 소속될 때"]}, {"label": "특징 1", "text": "→ 공동체 구성원들이 유대감을 바탕으로 각자의 책임과 의무를 다하며 공동체의 목표를 실현하는 것이 정의로운 것임", "masks": ["책임과 의무", "공동체의 목표"]}, {"label": "특징 2", "text": "개인은 공동체 구성원으로서 공동체 덕목을 실천하며 살아가는 존재임", "masks": ["공동체 덕목"]}, {"label": "특징 3", "text": "인간은 자신에게 주어진 사회적 역할을 수행함으로써 자아 정체성을 형성함", "masks": ["사회적 역할", "자아 정체성"]}, {"label": "특징 3", "text": "→ 국가가 개인의 삶에 일정 부분 개입할 수 있다고 인식함", "masks": ["개입할 수 있음"]}, {"label": "특징 3", "text": "→ 국가가 중립을 유지하는 것은 공동체의 목표를 포기하는 것과 같다고 봄", "masks": ["중립", "공동체의 목표를 포기"]}, {"label": "특징 4", "text": "공동체 목표를 지나치게 강조하면 개인의 자유와 권리가 침해되며, 개인의 희생이 강요될 수 있음", "masks": ["자유와 권리가 침해", "희생"]}, {"label": "특징 4", "text": "→ 개인의 능력이나 노력과 관계없이 개인이 속한 공동체를 기준으로 개인을 평가하는 연고주의가 심해질 수 있음", "masks": ["연고주의"]}, {"label": "개인", "text": "공동체의 역사와 문화를 전수받으며 소속감과 정체성을 형성하는 존재임", "masks": ["소속감과 정체성"]}, {"label": "사회(국가)", "text": "각 개인이 유기체적으로 결합하여 만들어진 집합체임", "masks": ["유기체적으로 결합"]}]}, {"title": "왈처 – 복합평등으로서의 정의", "group": "공동체주의적 정의관", "items": [{"label": "핵심", "text": "다양한 삶의 영역에서 각기 다른 공정한 기준에 따라 사회적 가치가 분배될 때 사회 정의가 실현됨", "masks": ["각기 다른 공정한 기준"]}, {"label": "핵심", "text": "→ 서로 다른 사회적 가치는 서로 다른 이유로 서로 다른 절차와 주체에 의해 분배되어야 함", "masks": ["서로 다른 이유", "서로 다른 절차와 주체"]}, {"label": "핵심", "text": "→ 각각의 사회적 가치가 자신의 고유한 영역 안에 머무름으로써 복합 평등이 실현될 때 정의로운 사회가 될 수 있다고 봄", "masks": ["고유한 영역", "복합 평등"]}, {"label": "핵심", "text": "→ 어떤 영역에서 중요한 사회적 가치가 다른 영역의 사회적 가치를 잠식하는 전제에 반대", "masks": ["다른 영역의 사회적 가치를 잠식"]}, {"label": "핵심", "text": "공동체의 역사적・문화적 맥락에 따른 다양한 정의 기준을 인정함", "masks": ["역사적・문화적 맥락", "다양한 정의 기준"]}]}, {"title": "왈처 제시문", "group": "공동체주의적 정의관", "items": [{"label": "제시문 1", "text": "정치적 평등주의의 목표는 지배가 없는 사회, 즉 어떠한 사회적 가치도 결코 지배의 수단으로 이용되지 않는 사회, 혹은 그렇게 이용될 수도 없는 사회이다. 이것은 다양한 차이를 철폐하려는 것이 아니다. 지배의 수단을 소유하거나 통제하는 사람이 전혀 없을 때, 우리는 서로 평등하다.", "masks": ["지배", "다원적", "상이한", "역사적이고 문화적인 소산", "고유한 영역", "복합 평등"]}, {"label": "제시문 2", "text": "정의의 원칙은 다원적이다. 상이한 사회적 가치는 상이한 근거에 따라 상이한 절차에 맞게 상이한 주체에 의해 분배되어야 한다.", "masks": ["지배", "다원적", "상이한", "역사적이고 문화적인 소산", "고유한 영역", "복합 평등"]}, {"label": "제시문 3", "text": "사회적 가치는 각 공동체의 역사적이고 문화적인 소산으로, 공동체 안에는 고유한 사회적 가치들이 존재한다. 모든 사회에서 동일하게 중요하다고 인정되는 가치는 없으므로, 가치를 분배할 때는 공동체의 문화적 특수성과 차이를 고려해야 한다. …(중략)… 한편, 사회적 가치들은 고유한 영역을 가지며, 각각의 사회적 가치들이 고유한 영역 안에 머무를 때 다원적 평등이 실현될 수 있다.", "masks": ["지배", "다원적", "상이한", "역사적이고 문화적인 소산", "고유한 영역", "복합 평등"]}, {"label": "제시문 4", "text": "복합 평등이란 한 영역 안에서 혹은 어떤 사회적 가치와 관련하여 한 시민이 지닌 어떠한 위치도 다른 영역 혹은 다른 가치와 관련된 그의 지위 때문에 침해당할 수 없음을 의미한다. 예를 들어 시민 X가 공직에서 시민 Y보다 우선하여 선택될 수 있으며, 이때 두 사람은 정치 영역에서 불평등하게 된다. 그러나 공직에 있다는 이유 때문에 이 외의 모든 영역에서 X에게 우선적인 의료 혜택, 자녀 취학의 우선권, 다른 취업 기회들 등과 같은 혜택이 주어지지 않는 한, 이 두 사람이 일반적으로 불평등한 것은 아니다. 공직이 지배적 가치가 아닌 한, 또한 일반적으로 전환될 수 없는 한, 공직 소유자는 그들이 통치하는 사람들과 전체적으로 불평등하지 않다.", "masks": ["지배", "다원적", "상이한", "역사적이고 문화적인 소산", "고유한 영역", "복합 평등"]}, {"label": "제시문 5", "text": "다원적 평등 체제는 전제(專制)와 정반대가 된다. 이 체제는 지배를 불가능하도록 하는 일군의 관계를 정립한다. 형식적인 어법으로 말한다면, 다원적 평등이란 한 영역 안에서 혹은 다른 사회적 가치와 관련하여 시민이 지닌 어떠한 지위도 어떤 다른 영역 혹은 다른 가치와 관련된 그의 지위 때문에 침해당할 수 없다는 것을 의미한다.", "masks": ["지배", "다원적", "상이한", "역사적이고 문화적인 소산", "고유한 영역", "복합 평등"]}]}, {"title": "매킨타이어", "group": "공동체주의적 정의관", "items": [{"label": "1. 행위자 중심", "text": "행위자의 성품을 먼저 평가", "masks": ["행위자의 성품"]}, {"label": "1)", "text": "이를 근거로 행위의 옳고 그름을 판단해야 한다고 봄", "masks": ["옳고 그름"]}, {"label": "2)", "text": "윤리적으로 옳고 선한 결정을 하려면 유덕한 성품을 길러야 한다고 봄", "masks": ["유덕한 성품"]}, {"label": "3)", "text": "유덕한 성품을 갖추려면 옳고 선한 행위를 습관화하여 내면화해야 함", "masks": ["습관화하여 내면화"]}, {"label": "2. 자연적 감정과 동기 중시", "text": "인간의 욕구나 감정, 인간관계에 주목함", "masks": ["욕구나 감정, 인간관계"]}, {"label": "3.", "text": "개인의 자유와 선택보다는 공동체의 전통과 역사를 더 중시하며, 도덕적 판단에서 구체적이고 맥락적인 사고를 중시할 것을 주장", "masks": ["공동체의 전통과 역사", "구체적이고 맥락적인 사고"]}]}, {"title": "매킨타이어 제시문", "group": "공동체주의적 정의관", "items": [{"label": "제시문 1", "text": "나는 나의 가족, 나의 도시, 나의 부족, 나의 민족으로부터 다양한 부채와 유산, 정당한 기대와 책무를 물려 받는다. 그것들은 나의 삶의 주어진 사실과 나의 도덕적 출발점을 구성한다. 이것은 나의 삶에 그 나름의 도덕적 특수성을 부분적으로 제공한다.", "masks": ["공동체", "유산", "책무", "덕", "실천", d"><div class="label">${s.title} · ${level}단계</div><div class="toolbar"><button id="all">전체 정답 보기</button><button id="reset">모두 다시 가리기</button></div></div>`+s.items.map(x=>`<div class="card"><div class="label">${esc(x.label)}</div><div class="text">${maskText(x.text,x.masks,level)}</div></div>`).join('');bindMasks();$('#all').onclick=()=>document.querySelectorAll('.mask').forEach(x=>{x.classList.add('reveal');x.textContent=x.dataset.a});$('#reset').onclick=()=>document.querySelectorAll('.mask').forEach(x=>{x.classList.remove('reveal');x.textContent='█'.repeat(Math.min(14,Math.max(3,x.dataset.a.length)))})}else{content.innerHTML=`<div class="card"><div class="label">${s.title} · 3단계</div><div class="progress">원문을 읽고 제목/사상가/관점을 먼저 떠올린 뒤 확인하세요.</div></div>`+s.items.map(x=>`<div class="card"><div class="text">${esc(x.text)}</div><button class="who" data-a="${esc(x.label)}">정답 확인</button><div class="label hidden answer" style="margin-top:10px;font-size:16px">정답: ${esc(x.label)}</div></div>`).join('');document.querySelectorAll('.who').forEach(b=>b.onclick=()=>b.nextElementSibling.classList.remove('hidden'))}}document.querySelectorAll('.group').forEach(b=>b.onclick=()=>{group=b.dataset.g;section=0;render()});render();</script></body></html>
